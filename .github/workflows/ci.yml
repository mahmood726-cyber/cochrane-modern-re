name: ci
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    name: Fast tier (preflight + unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - uses: r-lib/actions/setup-renv@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Fast tier — preflight + contracts + loader unit + flip + aggregator + dashboard
        run: |
          python -m pytest -v \
            tests/test_preflight.py \
            tests/test_contracts.py \
            tests/test_flip_classifier.py \
            tests/test_aggregator.py \
            tests/test_dashboard.py \
            -k "not integration and not bayesmeta"

  slow:
    name: Slow tier (Bayesian + integration)
    needs: fast
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - uses: r-lib/actions/setup-renv@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python package
        run: pip install -e ".[dev]"

      # The loader's unit tests execute MetaAudit's real effect computations,
      # even on synthetic inputs. Keep this external implementation pinned:
      # otherwise slow CI fails with ModuleNotFoundError and misses coverage.
      - name: Checkout pinned MetaAudit loader dependency
        uses: actions/checkout@v4
        with:
          repository: mahmood726-cyber/MetaAudit
          ref: 7ebdc18811e10ac69349605212a37d140a08a326
          path: external/MetaAudit
          persist-credentials: false

      - name: Install MetaAudit loader dependencies
        run: python -m pip install "pyreadr>=0.5.0" "scipy>=1.10.0"

      - name: Slow tier — Bayesian MC + method correctness + loader unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/external/MetaAudit
        run: python -m pytest -v tests/test_methods.py tests/test_bayesmeta_mc.py tests/test_loaders.py

      # The separate end-to-end test_integration.py still needs an actual
      # Pairwise70 .rda corpus; no user data is provisioned in public CI.
